name: spa-docker

on:
  push:
    branches: [main]
    paths:
      - "examples/spa/**"
  pull_request:
    branches: [main]
    paths:
      - "examples/spa/**"

env:
  ZIG_VERSION: "0.16.0"
  IMAGE: ttl.sh/jisr-spa-${{ github.sha }}:1h

jobs:
  publish:
    name: build and push multi-arch image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # ── Node + Vite build ─────────────────────────────────────────────────
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/spa/ui/package-lock.json

      - name: build Vite SPA
        run: make -C examples/spa ui

      # ── Go toolchain ──────────────────────────────────────────────────────
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true

      # ── Zig (on demand) ───────────────────────────────────────────────────
      - name: cache zig
        id: cache-zig
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/zig
          key: zig-${{ env.ZIG_VERSION }}-linux-x86_64

      - name: download zig
        if: steps.cache-zig.outputs.cache-hit != 'true'
        run: |
          URL="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL "$URL" | tar -xJ -C /tmp
          mv "/tmp/zig-x86_64-linux-${ZIG_VERSION}" /tmp/zig

      # ── Cross-compile .so for both arches on the host ─────────────────────
      - name: cross-compile libspa (amd64 + arm64)
        run: make -C examples/spa build-linux ZIG=/tmp/zig/zig

      # ── Docker buildx + push to ttl.sh ────────────────────────────────────
      - name: set up docker buildx
        uses: docker/setup-buildx-action@b5730b41e21e9e5c3b29c04c17ef3e1fefa8e63c # v3.10.0

      - name: build and push to ttl.sh
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: examples/spa
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}

      - name: image summary
        run: echo "pushed ${{ env.IMAGE }}" >> $GITHUB_STEP_SUMMARY
