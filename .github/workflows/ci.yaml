name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ENVOY_VERSION: "1.37.1"

jobs:
  # ── Unit tests: root module + all sub-packages ─────────────────────────────
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/spa/ui/package-lock.json
      - name: build spa ui
        run: make build-spa-ui
      - name: verify go.mod tidy
        run: make tidy-check
      - name: verify formatting
        run: make fmt-check
      - name: vet all modules
        run: make vet-all
      - name: test all modules
        run: make test-all
      - name: race test all modules
        run: make race-all
      - name: build examples
        run: make build-examples

  # ── e2e: build all .so files and run against real Envoy ───────────────────
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/spa/e2e/package-lock.json

      - name: cache envoy
        id: cache-envoy
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .envoy
          key: envoy-${{ env.ENVOY_VERSION }}-linux-amd64

      - name: download envoy
        if: steps.cache-envoy.outputs.cache-hit != 'true'
        run: |
          mkdir -p .envoy
          curl -fsSL \
            "https://archive.tetratelabs.io/envoy/download/v${ENVOY_VERSION}/envoy-v${ENVOY_VERSION}-linux-amd64.tar.xz" \
            -o /tmp/envoy.tar.xz
          tar -xJf /tmp/envoy.tar.xz --strip-components=2 -C .envoy
          chmod +x .envoy/envoy

      - name: run e2e tests
        env:
          ENVOY_BIN: ${{ github.workspace }}/.envoy/envoy
          JISR_SKIP_BUILD: "1"
        run: make e2e

      - name: run spa e2e tests
        env:
          ENVOY_BIN: ${{ github.workspace }}/.envoy/envoy
        run: bash examples/spa/e2e/run.sh

  # ── Docker: cross-compile .so on host, push multi-arch image to ttl.sh ────
  docker:
    name: docker (multi-arch)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/spa/ui/package-lock.json

      - name: build Vite SPA
        run: make -C examples/spa ui

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: cross-compile libspa (amd64 + arm64)
        run: make -C examples/spa build-linux

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: build and push to ttl.sh
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: examples/spa
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ttl.sh/jisr-spa-${{ github.sha }}:1h

      - name: image summary
        run: echo "ttl.sh/jisr-spa-${{ github.sha }}:1h" >> $GITHUB_STEP_SUMMARY
