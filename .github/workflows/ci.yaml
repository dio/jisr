name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ENVOY_VERSION: "1.37.1"

jobs:
  # ── Unit tests: root module + all sub-packages ─────────────────────────────
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/spa/ui/package-lock.json
      - name: build spa ui
        run: make build-spa-ui
      - name: verify go.mod tidy
        run: make tidy-check
      - name: verify formatting
        run: make fmt-check
      - name: vet all modules
        run: make vet-all
      - name: test all modules
        run: make test-all
      - name: race test all modules
        run: make race-all
      - name: build examples
        run: make build-examples

  # ── e2e: build all .so files and run against real Envoy ───────────────────
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: cache envoy
        id: cache-envoy
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .envoy
          key: envoy-${{ env.ENVOY_VERSION }}-linux-amd64

      - name: download envoy
        if: steps.cache-envoy.outputs.cache-hit != 'true'
        run: |
          mkdir -p .envoy
          curl -fsSL \
            "https://archive.tetratelabs.io/envoy/download/v${ENVOY_VERSION}/envoy-v${ENVOY_VERSION}-linux-amd64.tar.xz" \
            -o /tmp/envoy.tar.xz
          tar -xJf /tmp/envoy.tar.xz --strip-components=2 -C .envoy
          chmod +x .envoy/envoy

      - name: run e2e tests
        env:
          ENVOY_BIN: ${{ github.workspace }}/.envoy/envoy
          JISR_SKIP_BUILD: "1"
        run: make e2e
