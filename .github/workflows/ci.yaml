name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ENVOY_VERSION: "1.37.1"

jobs:
  # ── Unit tests: root module + all sub-packages ─────────────────────────────
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/spa/ui/package-lock.json
      - name: build spa ui
        run: cd examples/spa && make ui
      - name: build jisr
        run: CGO_ENABLED=1 go build ./...
      - name: test jisr
        run: go test -race ./...
      - name: test jisr/server
        run: cd server && go test -race ./...
      - name: test jisr/buffer
        run: cd buffer && go test -race ./...
      - name: test jisr/prof
        run: cd prof && go test -race ./...
      - name: test examples/decoder
        run: cd examples/decoder && go test -race ./...
      - name: test examples/sse-tap
        run: cd examples/sse-tap && go test -race ./...
      - name: test examples/multi-actor
        run: cd examples/multi-actor && go test -race ./...
      - name: test examples/spa
        run: cd examples/spa && go test -race ./...
      - name: test examples/ws-proxy
        run: cd examples/ws-proxy && go test -race ./...

  # ── e2e: build all .so files and run against real Envoy ───────────────────
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: cache envoy
        id: cache-envoy
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .envoy
          key: envoy-${{ env.ENVOY_VERSION }}-linux-amd64

      - name: download envoy
        if: steps.cache-envoy.outputs.cache-hit != 'true'
        run: |
          mkdir -p .envoy
          curl -fsSL \
            "https://archive.tetratelabs.io/envoy/download/v${ENVOY_VERSION}/envoy-v${ENVOY_VERSION}-linux-amd64.tar.xz" \
            -o /tmp/envoy.tar.xz
          tar -xJf /tmp/envoy.tar.xz --strip-components=2 -C .envoy
          chmod +x .envoy/envoy

      - name: build libhello.so
        run: make -C examples/hello build

      - name: build libdecoder.so
        run: make -C examples/decoder build

      - name: run e2e tests
        env:
          ENVOY_BIN: ${{ github.workspace }}/.envoy/envoy
          JISR_SKIP_BUILD: "1"
        run: |
          cd e2e && go test -v -tags e2e -timeout 60s ./...
