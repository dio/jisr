admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
    # Port 10000 — normal HTTP traffic through the filter chain.
    # WebSocket upgrades are NOT served here; they're routed to the ws-proxy cluster.
    - name: main
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                upgrade_configs:
                  - upgrade_type: websocket
                http_filters:
                  # ws-proxy filter is a no-op for normal HTTP —
                  # it only starts the embedded server in Create().
                  - name: ws-proxy
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                      dynamic_module_config:
                        name: ws-proxy
                      filter_name: ws-proxy
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: main
                  virtual_hosts:
                    - name: services
                      domains: ["*"]
                      routes:
                        # WebSocket upgrades → embedded WS proxy server.
                        # The port here must match what WSProxy logs at startup.
                        - match:
                            prefix: "/"
                            headers:
                              - name: upgrade
                                string_match:
                                  exact: websocket
                                  ignore_case: true
                          route:
                            cluster: ws-proxy-local

                        # All other HTTP traffic → real upstream.
                        - match: { prefix: "/" }
                          route: { cluster: upstream }

  clusters:
    # The embedded WS proxy server running inside the .so.
    # Port is fixed here for simplicity; in production read it from the filter
    # config or a shared config file written by the filter at startup.
    - name: ws-proxy-local
      type: STATIC
      load_assignment:
        cluster_name: ws-proxy-local
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 10001 }

    # Real upstream for non-WS traffic.
    # ws-auth runs as an upstream HTTP filter — it strips the client's auth
    # headers and injects the provider's credentials (Bearer token, x-api-key).
    # This is the correct placement: upstream filters run on the connection to
    # the upstream cluster, not on the downstream request.
    - name: upstream
      type: STRICT_DNS
      load_assignment:
        cluster_name: upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: api.openai.com, port_value: 443 }
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: api.openai.com
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
          http_filters:
            # ws-auth strips client credentials and injects provider credentials.
            # Reads OPENAI_API_KEY from environment at startup.
            - name: ws-auth
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                dynamic_module_config:
                  name: ws-proxy
                filter_name: ws-auth
            - name: envoy.filters.http.upstream_codec
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
